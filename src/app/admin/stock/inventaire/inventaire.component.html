<mat-toolbar color="primary" layou>
  <div fxLayout="row wrap" fxLayoutAlign="space-between center" class="w-100 p-3">
    <h2>Inventaire</h2>
    <button mat-icon-button (click)="addItem()" aria-label="Add Inventaire">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</mat-toolbar>

<div class="filters">
  <mat-card>
    <div fxLayout="row wrap" class="mt-3">
      <div fxFlex="100" fxFlex.gt-md="25" class="px-2">
        <mat-form-field appearance="fill">
          <mat-label>État</mat-label>
          <mat-select [(ngModel)]="etat" (ngModelChange)="fetchInventaire()">
            <mat-option [value]="null">Tous</mat-option>
            <mat-option value="actif">Actif</mat-option>
            <mat-option value="inactif">Inactif</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div fxFlex="100" fxFlex.gt-md="25" class="px-2">
        <mat-form-field appearance="fill">
          <mat-label>Date Début</mat-label>
          <input matInput [matDatepicker]="startDatePicker" [(ngModel)]="dateDebut" (ngModelChange)="fetchInventaire()"
                 placeholder="Date de début">
          <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #startDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div fxFlex="100" fxFlex.gt-md="25" class="px-2">
        <mat-form-field appearance="fill">
          <mat-label>Date Fin</mat-label>
          <input matInput [matDatepicker]="endDatePicker" [(ngModel)]="dateFin" (ngModelChange)="fetchInventaire()"
                 placeholder="Date de fin">
          <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #endDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div fxFlex="100" fxFlex.gt-md="25" class="px-2">
        <button mat-raised-button color="warn" (click)="resetFilters()">Réinitialiser</button>
      </div>
    </div>

  </mat-card>
</div>

<table mat-table [dataSource]="inventaire" class="mat-elevation-z8">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID</th>
    <td mat-cell *matCellDef="let element"> {{ element.id }}</td>
  </ng-container>

  <ng-container matColumnDef="dateDebut">
    <th mat-header-cell *matHeaderCellDef> Date Début</th>
    <td mat-cell *matCellDef="let element"> {{ element.dateDebut | date }}</td>
  </ng-container>

  <ng-container matColumnDef="dateFin">
    <th mat-header-cell *matHeaderCellDef> Date Fin</th>
    <td mat-cell *matCellDef="let element"> {{ element.dateFin | date }}</td>
  </ng-container>

  <ng-container matColumnDef="etat">
    <th mat-header-cell *matHeaderCellDef> État</th>
    <td mat-cell *matCellDef="let element"> {{ element.etat }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="primary" (click)="editItem(element)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteItem(element.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [length]="totalItems" [pageSize]="count" (page)="onPageChanged($event.pageIndex + 1)">
</mat-paginator>
