<form [formGroup]="form" (ngSubmit)="beginInventory()">
  <mat-toolbar color="primary">
    <div fxLayout="row wrap" fxLayoutAlign="space-between center" class="w-100 p-3">
      <h1 mat-dialog-title>{{ isEdit ? 'Update Inventory' : 'Add Inventory' }}</h1>
      <button mat-icon-button (click)="onCancel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <mat-dialog-content>
    <mat-card  class="mb-4">
      <div fxLayout="row wrap" class="mt-3">

          </mat-form-field>
        </div>-->
        <div fxFlex="100" fxFlex.gt-sm="50" class="px-1">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Categorie</mat-label>
            <mat-select formControlName="categorieId" required>
              <mat-option [value]="null">Tous les categories</mat-option>
              <mat-option *ngFor="let cat of categories" [value]="cat.id">{{ cat.nom }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div fxFlex="100" fxFlex.gt-sm="50" class="px-1">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Rayon</mat-label>
            <mat-select formControlName="rayonId" required>
              <mat-option [value]="null">Tous les rayons</mat-option>
              <mat-option *ngFor="let r of rayons" [value]="r.id">{{ r.nom }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div fxFlex="100" fxFlex.gt-sm="50" class="px-1">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Fournisseur</mat-label>
            <mat-select formControlName="fournisseurId" required>
              <mat-option [value]="null">Tous les fournisseurs</mat-option>
              <mat-option *ngFor="let e of fournisseurs" [value]="e.id">{{ e.nom }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div fxFlex="100" fxFlex.gt-sm="50" class="px-1">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Magasin</mat-label>
            <mat-select formControlName="magasinId" required>
              <mat-option [value]="null">Tous les magasins</mat-option>
              <mat-option *ngFor="let m of magasins" [value]="m.id">{{ m.nom }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div fxFlex="100" fxFlex.gt-sm="50" class="px-1">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Forme</mat-label>
            <mat-select formControlName="formeId" required>
              <mat-option [value]="null">Tous les formes</mat-option>
              <mat-option *ngFor="let f of formes" [value]="f.id">{{ f.nom }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div fxFlex="100" fxFlex.gt-sm="50" class="px-1">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Fabriquant</mat-label>
            <mat-select formControlName="fabriquantId" required>
              <mat-option [value]="null">Tous les fabriquants</mat-option>
              <mat-option *ngFor="let fa of fabriquants" [value]="fa.id">{{ fa.nom }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </mat-card>

  </mat-dialog-content>

  <mat-dialog-actions>
    <mat-toolbar >
      <div mat-dialog-actions fxLayout="row" fxLayoutAlign="space-between center">
        <button mat-button (click)="onCancel()">Cancel</button>
        <!-- Button for "add" type -->
        <button mat-raised-button
                type="submit"
                color="primary">
          Commencer un nouvel inventaire
        </button>
      </div>
    </mat-toolbar>
  </mat-dialog-actions>
</form>
