<mat-toolbar color="primary">
  <div fxLayout="row wrap" fxLayoutAlign="space-between center" class="w-100 p-3">
    <h1 mat-dialog-title>{{ isEdit ? 'Update Inventory' : 'Add Inventory' }}</h1>
    <button mat-icon-button (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</mat-toolbar>

<mat-card  class="mb-4">
  <div fxLayout="row wrap" class="mt-3">
    <div fxFlex="100" fxFlex.gt-md="25" class="px-2">
      <mat-form-field appearance="fill">
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startDatePicker" [(ngModel)]="data.dateDebut" placeholder="Select start date">
        <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #startDatePicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div fxFlex="100" fxFlex.gt-md="25" class="px-2">
      <mat-form-field appearance="fill">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endDatePicker" [(ngModel)]="data.dateFin" placeholder="Select end date">
        <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #endDatePicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div fxFlex="100" fxFlex.gt-md="25" class="px-2">
      <mat-form-field appearance="fill">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="data.etat">
          <mat-option value="active">Active</mat-option>
          <mat-option value="inactive">Inactive</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</mat-card>
<mat-divider></mat-divider>
<mat-card  class="mb-4">
  <div class="p-4" fxLayout="row wrap"  fxLayoutGap="16px" >
    <mat-form-field class="w-100 mt-2" appearance="outline" >
      <mat-label>Search Products</mat-label>
      <input type="text"
             matInput
             [formControl]="medControl"
             [matAutocomplete]="auto">
      <mat-autocomplete #auto="matAutocomplete">
        <mat-option *ngFor="let option of medOptions" [value]="option.name" (click)="openMedicamentDialog(option)">
          {{ option.name }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
  </div>

</mat-card>

<mat-card class="mb-4">
  <div  class="p-4" fxLayout="row wrap"  fxLayoutGap="16px" >
    <table mat-table [dataSource]="filteredProducts" class="mat-elevation-z8">
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox (change)="$event ? selectAll($event.checked) : null"></mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let product">
          <mat-checkbox [(ngModel)]="product.selected"></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID</th>
        <td mat-cell *matCellDef="let product"> {{ product.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name</th>
        <td mat-cell *matCellDef="let product"> {{ product.nom }}</td>
      </ng-container>

      <ng-container matColumnDef="quantitySystem">
        <th mat-header-cell *matHeaderCellDef> Quantité Système</th>
        <td mat-cell *matCellDef="let product"> {{ product.quantitySystem }}</td>
      </ng-container>

      <ng-container matColumnDef="quantityReal">
        <th mat-header-cell *matHeaderCellDef> Quantité Réel</th>
        <td mat-cell *matCellDef="let product">
          <mat-form-field style="width: 140px; height: 60px;" appearance="outline" class="small-input">
            <input matInput
                   [(ngModel)]="product.quantityReal"
                   type="number"
                   placeholder="Enter real quantity">
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="comparison">
        <th mat-header-cell *matHeaderCellDef> Comparison</th>
        <td mat-cell *matCellDef="let product">
          {{ product.quantityReal - product.quantitySystem }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['select', 'id', 'name', 'quantitySystem', 'quantityReal', 'comparison']"></tr>
      <tr mat-row
          *matRowDef="let row; columns: ['select', 'id', 'name', 'quantitySystem', 'quantityReal', 'comparison'];"></tr>
    </table>
  </div>
</mat-card>


<mat-toolbar >
  <div fxLayout="row" fxLayoutAlign="space-between center">
    <div mat-dialog-actions>
      <button mat-button (click)="onCancel()">Cancel</button>
      <!-- Button for "add" type -->
      <button mat-raised-button
              color="primary"
              (click)="addSelectedProducts()"
              *ngIf="data.type === 'add'"
              [disabled]="filteredProducts.length === 0 || !data.dateDebut">
        Sauvegarder
      </button>

      <!-- Button for "update" type -->
      <button mat-raised-button
              color="accent"
              (click)="onSave()"
              *ngIf="data.type === 'update'">
        Mise à jour
      </button>

      <!-- Button for "update" or other types -->
      <button mat-raised-button
              color="warn"
              (click)="onCloturer()"
              *ngIf="data.type === 'update' || data.type !== 'add'">
        Clôturer
      </button>

    </div>
  </div>
</mat-toolbar>
