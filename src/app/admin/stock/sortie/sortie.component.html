
<div class="p-2">
  <mat-card>
    <div fxLayout="row wrap" fxLayoutAlign="space-between center" class="w-100 p-3">
      <h2>Sortie de stock</h2>
      <button mat-raised-button color="primary" >Ajouter sortie</button>
    </div>
  </mat-card>
</div>
<div class="p-2">
  <mat-card>
    <mat-form-field class="search-field" appearance="outline">
      <mat-label>Rechercher</mat-label>
      <input matInput [formControl]="produitDetailSearchControl" [matAutocomplete]="produitDetailAuto">
      <mat-autocomplete #produitDetailAuto="matAutocomplete" (optionSelected)="onProduitDetailSelected($event)">
        <mat-option *ngFor="let produitDetail of produitDetailOptions" [value]="produitDetail.id" (click)="openProduitDetailInfoDialog(produitDetail)">
          {{ produitDetail.nom }}
        </mat-option>
      </mat-autocomplete>
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card>
</div>

<div class="p-2">
  <div class="table-wrapper">
    <table mat-table [dataSource]="sorties" class="data-table">


      <!-- Colonne Nom -->
      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef class="header-cell">Nom</th>
        <td mat-cell *matCellDef="let element" class="data-cell nom-cell">
          {{element.nom}}
        </td>
      </ng-container>

      <!-- Colonne Quantité -->
      <ng-container matColumnDef="quantite">
        <th mat-header-cell *matHeaderCellDef class="header-cell">Quantité</th>
        <td mat-cell *matCellDef="let element" class="data-cell quantite-cell">
          {{element.quantite}}
        </td>
      </ng-container>

      <!-- Colonne Forme -->
      <ng-container matColumnDef="forme">
        <th mat-header-cell *matHeaderCellDef class="header-cell">Forme</th>
        <td mat-cell *matCellDef="let element" class="data-cell">
          <mat-chip-listbox>
            <mat-chip-option
              [ngClass]="{
            'preparation-chip': element.forme === 'Préparation',
            'acquisition-chip': element.forme === 'Acquisition',
            'congestion-chip': element.forme === 'Congestion'
          }">
              {{element.forme}}
            </mat-chip-option>
          </mat-chip-listbox>
        </td>
      </ng-container>

      <!-- Colonne Date Opération -->
      <ng-container matColumnDef="dateOperation">
        <th mat-header-cell *matHeaderCellDef class="header-cell">Date Opération</th>
        <td mat-cell *matCellDef="let element" class="data-cell">
          {{element.dateOperation | date:'dd/MM/yyyy HH:mm'}}
        </td>
      </ng-container>

      <!-- Colonne Opération -->
      <ng-container matColumnDef="operation">
        <th mat-header-cell *matHeaderCellDef class="header-cell">Opération</th>
        <td mat-cell *matCellDef="let element" class="data-cell">
          <mat-chip-listbox>
            <mat-chip-option
              [ngClass]="{
            'vente-chip': element.operation === 'Vente',
            'achat-chip': element.operation === 'Achat'
          }">
              {{element.operation}}
            </mat-chip-option>
          </mat-chip-listbox>
        </td>
      </ng-container>

      <!-- Colonne Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="header-cell">Actions</th>
        <td mat-cell *matCellDef="let element" class="data-cell actions-cell">
          <button mat-icon-button
                  color="primary"
                  (click)="onView(element)"
                  matTooltip="Voir">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button
                  color="accent"
                  (click)="onEdit(element)"
                  matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button
                  color="warn"
                  (click)="onDelete(element)"
                  matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- En-tête et lignes du tableau -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Message si aucune donnée -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          <div class="no-data-message">
            <mat-icon>info</mat-icon>
            <p>Aucune donnée trouvée</p>
          </div>
        </td>
      </tr>
    </table>

  </div>
</div>
