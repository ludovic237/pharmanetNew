<mat-toolbar color="primary">
  <div fxLayout="row" fxLayoutAlign="space-between center">
    <h2>Mettre a jour produit commande</h2>
    <button mat-raised-button color="primary" (click)="onSetDefault()" class="default-button">
      Définir par défaut
    </button>
  </div>
</mat-toolbar>
<div class="detail-dialog">
  <mat-dialog-content class="dialog-content">
    <form [formGroup]="detailForm" class="detail-form">


      <div class="form-fields">
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Prix d'achat</mat-label>
          <input matInput type="number" formControlName="prixAchat" min="0">
          <mat-error *ngIf="detailForm.get('prixAchat')?.hasError('required')">
            Prix d'achat requis
          </mat-error>
          <mat-error *ngIf="detailForm.get('prixAchat')?.hasError('min')">
            Prix d'achat doit être positif
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Prix de vente</mat-label>
          <input matInput type="number" formControlName="prixVente" min="0">
          <mat-error *ngIf="detailForm.get('prixVente')?.hasError('required')">
            Prix de vente requis
          </mat-error>
          <mat-error *ngIf="detailForm.get('prixVente')?.hasError('min')">
            Prix de vente doit être positif
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Quantité Recu</mat-label>
          <input matInput type="number" formControlName="qteRecu" min="0">
          <mat-error *ngIf="detailForm.get('qteRecu')?.hasError('required')">
            Quantité restante requise
          </mat-error>
          <mat-error *ngIf="detailForm.get('qteRecu')?.hasError('min')">
            Quantité doit être positive ou nulle
          </mat-error>
        </mat-form-field>

      </div>
    </form>


  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button (click)="onCancel()" class="cancel-button">
      Annuler
    </button>
    <button mat-raised-button color="primary" (click)="onSave()"
            [disabled]="!detailForm.valid" class="save-button">
      Sauvegarder
    </button>
  </mat-dialog-actions>
</div>
