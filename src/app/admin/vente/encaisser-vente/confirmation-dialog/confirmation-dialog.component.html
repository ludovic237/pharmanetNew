<h1 mat-dialog-title>{{title}}</h1>

<div mat-dialog-content>
  <p>{{message}}</p>
</div>

<div mat-dialog-actions>
  <div fxLayout="row" fxLayoutAlign="space-between center" class="w-100 p-3">
    <button mat-raised-button color="warn" (click)="onDismiss()">{{ 'BTN.NO' | translate }}</button>
    <button mat-raised-button color="primary" (click)="onConfirm()">{{ 'BTN.YES' | translate }}</button>
  </div>
</div>
