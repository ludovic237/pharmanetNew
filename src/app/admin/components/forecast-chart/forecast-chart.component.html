<mat-accordion>
  <mat-expansion-panel expanded>
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon color="warn">warning</mat-icon><h3>Prévision des ventes</h3>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-scrollbar orientation="vertical" pointerEventsMethod="scrollbar">
      <mat-card>
        <mat-card-content style="height:320px">
          @if (!loading && lineChartData) {
            <canvas baseChart
              [data]="lineChartData"
              [options]="lineChartOptions"
              >
              <!--              [type]="line">-->
            </canvas>
          } @else {
            <div class="center">
              <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
            </div>
          }
        </mat-card-content>
      </mat-card>
    </ng-scrollbar>
  </mat-expansion-panel>
</mat-accordion>
