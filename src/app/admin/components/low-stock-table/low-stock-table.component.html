<mat-accordion>
  <mat-expansion-panel expanded>
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon color="warn">warning</mat-icon><h3>Stock faible</h3>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-scrollbar orientation="vertical" pointerEventsMethod="scrollbar">
      <mat-card>
        <mat-card-content>
          @if (loading) {
            <div class="center">
              <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
            </div>
          }

          @if (!loading) {
            <div>
              <table mat-table [dataSource]="dataSource" matSort>
                <ng-container matColumnDef="produit">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Produit</th>
                  <td mat-cell *matCellDef="let row">{{ row.produit }}</td>
                </ng-container>
                <ng-container matColumnDef="stock">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
                  <td mat-cell *matCellDef="let row">{{ row.stock }}</td>
                </ng-container>
                <ng-container matColumnDef="threshold">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Seuil</th>
                  <td mat-cell *matCellDef="let row">{{ row.threshold }}</td>
                </ng-container>
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef>Actions</th>
                  <td mat-cell *matCellDef="let row">
                    <button mat-stroked-button color="primary" (click)="order(row)">Commander</button>
                  </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row        *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              <mat-paginator [showFirstLastButtons]="true"
                             [pageSize]="10" [pageSizeOptions]="[5,10,25]"></mat-paginator>
            </div>
          }
        </mat-card-content>
      </mat-card>
    </ng-scrollbar>
  </mat-expansion-panel>
</mat-accordion>
