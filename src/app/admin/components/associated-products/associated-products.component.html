<mat-card class="reco-card">
  <div class="header">
    <div class="title">
      <mat-icon color="primary">hub</mat-icon>
      <h2>{{ ctxTitle }}</h2>
      <div class="subtitle">{{ subtitle }}</div>
    </div>

    <div class="filters" *ngIf="productId">
      <mat-chip-listbox>
        <mat-chip-option selected>
          Produit #{{ productId }}
        </mat-chip-option>
      </mat-chip-listbox>
    </div>
  </div>

  <ng-container *ngIf="loading">
    <div class="loading">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
  </ng-container>

  <ng-container *ngIf="!loading && error">
    <div class="error">
      <mat-icon color="warn">error_outline</mat-icon>
      {{ error }}
    </div>
  </ng-container>

<!--  <ng-container *ngIf="!loading && !error">-->
<!--    <ng-container *ngIf="(items$ | async) as items; else empty">-->
      <div class="list">
        <mat-card class="item" *ngFor="let it of items; trackBy: trackById">
          <div class="left">
            <div class="rank" matBadge="{{ it.rank }}" matBadgeColor="primary"></div>
            <div class="name-id">
              <div class="name">
                <span class="dot blue"></span>
                {{ it.produit || ('Produit #' + it.produit_id) }}
              </div>
              <div class="assoc">
                <span class="bar"></span>
                <span class="label">associé avec</span>
              </div>
              <div class="pair">
                <span class="dot green"></span>
                <!-- Ici, c’est une reco “voisine” : vous affichez juste l’item courant.
                     S’il y a un produit “source” (productId), l’UX peut le rappeler au-dessus. -->
                ID: {{ it.produit_id }}
              </div>
            </div>
          </div>

          <div class="right">
            <div class="freq">{{ it.percent }}% freq.</div>
            <mat-progress-bar mode="determinate" [value]="it.percent"></mat-progress-bar>
          </div>
        </mat-card>
      </div>
<!--    </ng-container>-->

<!--    <ng-template #empty>-->
<!--      <div class="empty">-->
<!--        <mat-icon>info</mat-icon>-->
<!--        Aucune recommandation disponible.-->
<!--      </div>-->
<!--    </ng-template>-->
<!--  </ng-container>-->
</mat-card>
