<mat-accordion>
  <mat-expansion-panel expanded>
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon color="warn">bar_chart</mat-icon><h3>Ventes mensuelles</h3>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-scrollbar  orientation="vertical" pointerEventsMethod="scrollbar">
      <canvas baseChart
              [type]="'bar'"
              [data]="data">
      </canvas>
    </ng-scrollbar>
  </mat-expansion-panel>
</mat-accordion>
